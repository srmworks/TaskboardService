<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskBoard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { margin-bottom: .25rem; }
    form { display: flex; gap: .5rem; margin: 1rem 0; }
    input[type=text] { flex: 1; padding: .5rem; font-size: 1rem; }
    button { padding: .5rem .9rem; font-size: 1rem; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: .5rem; padding: .4rem 0; border-bottom: 1px solid #ddd; }
    li span { flex: 1; }
    li.done span { text-decoration: line-through; color: #777; }
    .stats { display: flex; gap: 1rem; background: #f3f5f8; padding: .75rem; border-radius: 6px; }
    .meta { font-size: .85rem; color: #555; margin-top: 1rem; }
    .error { color: #b00020; min-height: 1.2rem; }
  </style>
</head>
<body>
  <h1>TaskBoard</h1>
  <p>Taskboard Service demo: web-gateway &rarr; task-service &rarr; PostgreSQL.</p>

  <section class="stats" aria-label="Statistics" aria-live="polite">
    <div>Total: <strong id="s-total">-</strong></div>
    <div>Done: <strong id="s-done">-</strong></div>
    <div>Pending: <strong id="s-pending">-</strong></div>
    <div>Completion: <strong id="s-rate">-</strong></div>
  </section>

  <form id="add-form">
    <input id="title" type="text" maxlength="200" placeholder="What needs to be done?" required aria-label="New task title">
    <button type="submit">Add</button>
  </form>
  <div id="error" class="error" role="alert"></div>

  <ul id="tasks" aria-label="Tasks"></ul>

  <div class="meta" aria-live="polite">
    Last request served by gateway pod <code id="m-gw">-</code>
    and task-service pod <code id="m-ts">-</code>.
    <button id="refresh" type="button">Refresh</button>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      if (res.status === 204) return null;
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
      $("m-gw").textContent = json.gateway || "-";
      $("m-ts").textContent = json.served_by || "-";
      return json;
    }

    function renderTasks(tasks) {
      const list = $("tasks");
      list.replaceChildren();
      for (const t of tasks) {
        const li = document.createElement("li");
        if (t.done) li.classList.add("done");

        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = t.done;
        box.setAttribute("aria-label", `Mark "${t.title}" as done`);
        box.onchange = () => run(() => api("PUT", `/api/tasks/${t.id}`, { done: box.checked }));

        const span = document.createElement("span");
        span.textContent = t.title;  // textContent avoids HTML injection

        const del = document.createElement("button");
        del.type = "button";
        del.textContent = "Delete";
        del.setAttribute("aria-label", `Delete "${t.title}"`);
        del.onclick = () => run(() => api("DELETE", `/api/tasks/${t.id}`));

        li.append(box, span, del);
        list.append(li);
      }
    }

    async function refresh() {
      const [tasks, stats] = await Promise.all([api("GET", "/api/tasks"), api("GET", "/api/stats")]);
      renderTasks(tasks.data);
      const s = stats.data;
      $("s-total").textContent = s.total;
      $("s-done").textContent = s.done;
      $("s-pending").textContent = s.pending;
      $("s-rate").textContent = Math.round(s.completion_rate * 100) + "%";
    }

    async function run(action) {
      $("error").textContent = "";
      try {
        await action();
        await refresh();
      } catch (e) {
        $("error").textContent = e.message;
      }
    }

    $("add-form").onsubmit = (ev) => {
      ev.preventDefault();
      const title = $("title").value;
      run(async () => { await api("POST", "/api/tasks", { title }); $("title").value = ""; });
    };
    $("refresh").onclick = () => run(async () => {});

    run(async () => {});
  </script>
</body>
</html>
